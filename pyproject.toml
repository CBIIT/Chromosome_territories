[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-pq-arm-analyzer"
version = "0.3.6"
description = "Interactive napari plugin for Cellpose nuclei segmentation, streamlined P/Q arm segmentation, batch scene analysis, saved configurations, and expanded 3D measurements."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Adib Keikhosravi, Ph.D.", email = "adib.keikhosravi@nih.gov"}]
classifiers = [
    "Framework :: napari",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "napari>=0.4.18",
    "qtpy",
    "numpy",
    "pandas",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "joblib",
    "tifffile",
    "aicsimageio",
    "matplotlib",
    "cellpose>=2,<4",
]

[project.optional-dependencies]
extra-readers = [
    "readlif",
    "nd2reader",
    "imaris-ims-file-reader",
]

[project.entry-points."napari.manifest"]
napari-pq-arm-analyzer = "napari_pq_arm_analyzer:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_pq_arm_analyzer = ["napari.yaml"]
